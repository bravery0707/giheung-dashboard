name: 공개 원본 업로드 검사
on:
  push:
    branches: [main]
    paths: ['incoming/**', 'data/listings.json', 'data/listing-history.json', 'data/collection-status.json']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build-public.mjs --check
      # Imports are local only. This check cannot erase data already committed to Git history.
