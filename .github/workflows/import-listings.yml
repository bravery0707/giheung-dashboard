name: 매물 엑셀 반영
on:
  push:
    branches: [main]
    paths: ["incoming/listings.xlsx", "incoming/listings.date.txt", "incoming/listings.json"]
  workflow_dispatch:
    inputs:
      date:
        description: "엑셀의 실제 조사일 YYYY-MM-DD (JSON은 내부 조사일 사용)"
        default: ""
      replace_date:
        description: "같은 조사일 교체"
        type: boolean
        default: false
      accept_count_drop:
        description: "전체 건수 확인 후 급감한 스냅샷 승인"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: data-commit
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 입력 확인
        id: input
        run: |
          if [ -f incoming/listings.json ] || [ -f incoming/listings.xlsx ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: 조사일과 전체 건수 검증 후 반영
        if: steps.input.outputs.found == 'true'
        id: import
        continue-on-error: true
        env:
          SURVEY_DATE: ${{ inputs.date }}
          REPLACE_DATE: ${{ inputs.replace_date }}
          ACCEPT_COUNT_DROP: ${{ inputs.accept_count_drop }}
        run: |
          args=()
          if [ "$REPLACE_DATE" = "true" ]; then args+=(--replace-date); fi
          if [ "$ACCEPT_COUNT_DROP" = "true" ]; then args+=(--accept-count-drop); fi
          if [ -f incoming/listings.json ] && [ -f incoming/listings.xlsx ]; then
            node --input-type=module -e "import {saveFailure} from './scripts/listing-storage.mjs'; await saveFailure('data')"
            echo "::error::JSON과 엑셀 중 하나만 업로드하세요."
            exit 1
          elif [ -f incoming/listings.json ]; then
            node scripts/import-listings.mjs incoming/listings.json "${args[@]}"
          else
            if [ -z "$SURVEY_DATE" ] && [ -f incoming/listings.date.txt ]; then
              SURVEY_DATE="$(tr -d '\r\n' < incoming/listings.date.txt)"
            fi
            node scripts/import-listings.mjs incoming/listings.xlsx --date "$SURVEY_DATE" "${args[@]}"
          fi
      - name: 결과 저장
        if: steps.input.outputs.found == 'true'
        env:
          IMPORT_OUTCOME: ${{ steps.import.outcome }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/collection-status.json
          if [ "$IMPORT_OUTCOME" = "success" ]; then
            rm -f incoming/listings.xlsx incoming/listings.json incoming/listings.date.txt
            git add -A data/listings.json data/listing-history.json incoming
          fi
          if ! git diff --cached --quiet; then
            git commit -m "chore: 매물 스냅샷 반영 결과"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
      - name: 반영 결과 확인
        if: steps.import.outcome == 'failure'
        run: exit 1
