name: 실거래 데이터 갱신

on:
  schedule:
    - cron: "0 20 * * *" # UTC 20:00 = KST 05:00
  workflow_dispatch:
    inputs:
      months:
        description: "수집할 개월 수"
        default: "36"

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 파일 불러오기
        uses: actions/checkout@v4

      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 인증키 확인
        run: |
          if [ -z "${{ secrets.DATA_GO_KR_KEY }}" ]; then
            echo "::error::저장소 시크릿 DATA_GO_KR_KEY가 없습니다."
            exit 1
          fi

      - name: 국토부 실거래가 수집
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: node scripts/update.mjs --months ${{ github.event.inputs.months || '36' }}

      - name: 수집 결과 요약
        run: |
          node -e "
            const j=require('./data/transactions.json');
            console.log('updated:', j.updated, '| count:', j.count);
            console.log('used:', (j.apisUsed||[]).join(', ') || '(없음)');
            console.log('skipped:', (j.apisSkipped||[]).join(', ') || '(없음)');
            const d=j.transactions.map(x=>x.date).sort();
            console.log('거래일 범위:', d[0], '~', d[d.length-1]);
          "

      - name: 변경분 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/transactions.json

          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: 실거래 데이터 갱신 ($(TZ=Asia/Seoul date +%F))"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          fi
