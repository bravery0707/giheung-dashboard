name: 매물 비공개 저장 검사
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build-public.mjs --check
      # Collection runs only on the owner's PC; no feed request or raw-data artifact here.
